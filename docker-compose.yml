version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: converza-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-converza}
      POSTGRES_USER: ${POSTGRES_USER:-converza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-converza_secret_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-converza} -d ${POSTGRES_DB:-converza}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: converza-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-converza}:${POSTGRES_PASSWORD:-converza_secret_pass}@postgres:5432/${POSTGRES_DB:-converza}
      - SECRET_KEY=${SECRET_KEY:-converza-secret-super-key-2026-whatsapp-crm-brazil}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID:-}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN:-}
      - WHATSAPP_VERIFY_TOKEN=${WHATSAPP_VERIFY_TOKEN:-converza_verify_token_2026}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: converza-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data: